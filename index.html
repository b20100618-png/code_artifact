<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 設置響應式視埠，確保在手機與桌面裝置都能完美顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庫洛米夜空大冒險 Kuromi Runner</title>

    <!-- 載入 Google Fonts: Fredoka 圓潤卡通字型 與 Noto Sans TC 繁體中文 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 自訂 CSS 樣式與動態效果 -->
    <style>
        /* 全局字體與背景設定 */
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #1e102d 0%, #3b154c 50%, #5c1b69 100%);
            color: #ffffff;
            user-select: none; /* 防止遊戲中選取文字 */
            overflow: hidden; /* 隱藏捲軸 */
        }

        /* 庫洛米卡通風格陰影與邊框 */
        .kuromi-card {
            background: rgba(30, 16, 45, 0.85);
            border: 4px solid #ff77bc;
            box-shadow: 0 10px 0px #2a0845, 0 15px 25px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        .kuromi-btn {
            background: linear-gradient(180deg, #ff77bc 0%, #e6399b 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 6px 0px #9b1b68;
            transition: all 0.1s ease;
        }

        .kuromi-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #9b1b68;
        }

        .kuromi-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #9b1b68;
        }

        /* 動態背景飄浮元素 CSS 動畫 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 5px #ff77bc); }
            50% { filter: drop-shadow(0 0 15px #ff77bc); }
        }

        .floating-element {
            animation: floatSlow 4s ease-in-out infinite;
        }

        .glow-effect {
            animation: pulseGlow 2.5s infinite;
        }

        /* 畫布樣式 */
        canvas {
            display: block;
            touch-action: none; /* 停用畫布預設觸控行為（防止滑動頁面） */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- 頂部遊戲標題 -->
    <header class="text-center mb-3 floating-element z-10">
        <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-300 to-pink-400 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] tracking-wider">
            KUROMI RUNNER
        </h1>
        <p class="text-xs sm:text-sm font-bold text-pink-300 tracking-widest mt-1">
            ★ 庫洛米夜空大冒險 ★
        </p>
    </header>

    <!-- 遊戲主體容器卡片 -->
    <main class="relative w-full max-w-4xl kuromi-card p-3 sm:p-5 flex flex-col items-center overflow-hidden">
        
        <!-- 分數計數器列 -->
        <div class="w-full flex justify-between items-center mb-3 px-2 text-sm sm:text-lg font-extrabold">
            <!-- 當前分數 -->
            <div class="flex items-center space-x-2 bg-purple-950/80 px-4 py-1.5 rounded-full border-2 border-pink-400">
                <span class="text-pink-400">SCORE:</span>
                <span id="scoreText" class="text-yellow-300 text-xl font-black">0</span>
            </div>
            
            <!-- 收集愛心數 -->
            <div class="flex items-center space-x-2 bg-purple-950/80 px-4 py-1.5 rounded-full border-2 border-pink-400">
                <span class="text-pink-400">HEARTS:</span>
                <span id="heartsText" class="text-pink-300 text-xl font-black">0</span>
            </div>

            <!-- 最高紀錄 -->
            <div class="flex items-center space-x-2 bg-purple-950/80 px-4 py-1.5 rounded-full border-2 border-purple-400">
                <span class="text-purple-300">BEST:</span>
                <span id="highScoreText" class="text-white text-xl font-black">0</span>
            </div>
        </div>

        <!-- Canvas 遊戲畫布區域 -->
        <div class="relative w-full aspect-[16/9] sm:aspect-[2/1] max-h-[450px] bg-slate-900 rounded-xl overflow-hidden border-2 border-purple-500/50 shadow-inner">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>

            <!-- 開始遊戲 overlay 覆蓋層 -->
            <div id="startOverlay" class="absolute inset-0 bg-purple-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
                <div class="w-24 h-24 mb-3 glow-effect">
                    <!-- 庫洛米頭像預覽 SVG 圖案 (根據官方圖完全還原版) -->
                    <svg viewBox="0 0 120 120" class="w-full h-full drop-shadow-lg">
                        <!-- 黑色頭巾與高聳雙角 (深灰/黑色 #2c2c2c，深色外框 #1a1a1a) -->
                        <path d="M 60,30 C 40,30 25,42 25,60 C 25,78 40,90 60,90 C 80,90 95,78 95,60 C 95,42 80,30 60,30 Z" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="3"/>
                        
                        <!-- 左耳朵與灰球 -->
                        <path d="M 38,36 L 15,10 L 48,22 Z" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
                        <circle cx="15" cy="10" r="4.5" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/>

                        <!-- 右耳朵與灰球 -->
                        <path d="M 82,36 L 105,10 L 72,22 Z" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
                        <circle cx="105" cy="10" r="4.5" fill="#4a4a4a" stroke="#1a1a1a" stroke-width="2"/>

                        <!-- 雙弧形心形白臉 -->
                        <path d="M 60,54 C 54,47 42,47 34,55 C 30,65 34,78 42,83 C 50,86 70,86 78,83 C 86,78 90,65 86,55 C 78,47 66,47 60,54 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>

                        <!-- 額頭粉紅骷髏圖騰 -->
                        <circle cx="60" cy="41" r="7.5" fill="#ff77bc" stroke="#1a1a1a" stroke-width="1.8"/>
                        <!-- 骷髏牙齒刷痕 (3條) -->
                        <path d="M 57.5,48.5 L 57.5,51 M 60,48.5 L 60,51 M 62.5,48.5 L 62.5,51" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- 骷髏眼睛 -->
                        <circle cx="57" cy="41" r="1.5" fill="#1a1a1a"/>
                        <circle cx="63" cy="41" r="1.5" fill="#1a1a1a"/>

                        <!-- 黑色長橢圓斜眼與睫毛 -->
                        <ellipse cx="46" cy="62" rx="3.5" ry="5.5" fill="#1a1a1a" transform="rotate(-8 46 62)"/>
                        <ellipse cx="74" cy="62" rx="3.5" ry="5.5" fill="#1a1a1a" transform="rotate(8 74 62)"/>
                        <path d="M 42,57 L 39,54 M 44,55 L 41,52" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                        <path d="M 78,57 L 81,54 M 76,55 L 79,52" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

                        <!-- 粉紅鼻子與微笑嘴巴 -->
                        <ellipse cx="60" cy="66" rx="2" ry="1.5" fill="#ff77bc" stroke="#1a1a1a" stroke-width="1"/>
                        <path d="M 57,70 Q 60,73 63,70" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

                        <!-- 黑色小丑領圈 (Jester Collar) 與粉紅球球 -->
                        <path d="M 40,84 L 30,94 L 46,88 L 60,98 L 74,88 L 90,94 L 80,84 Z" fill="#2c2c2c" stroke="#1a1a1a" stroke-width="2"/>
                        <circle cx="30" cy="94" r="3.5" fill="#ff77bc" stroke="#1a1a1a" stroke-width="1.2"/>
                        <circle cx="60" cy="98" r="3.5" fill="#ff77bc" stroke="#1a1a1a" stroke-width="1.2"/>
                        <circle cx="90" cy="94" r="3.5" fill="#ff77bc" stroke="#1a1a1a" stroke-width="1.2"/>
                    </svg>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-pink-300 mb-2">準備好開跑了嗎？</h2>
                <p class="text-xs sm:text-sm text-purple-200 mb-6 max-w-md">
                    避開黑色甜甜圈與骷髏頭障礙物，收集粉紅愛心與金幣獲得高分！<br>
                    <span class="text-pink-400 font-bold">按空白鍵 / 向上鍵：跳躍 | 向下鍵：蹲下</span>
                </p>
                <button id="startBtn" class="kuromi-btn px-8 py-3 text-white text-xl font-black tracking-wider rounded-full uppercase">
                    開始遊戲 START
                </button>
            </div>

            <!-- 遊戲結束 Overlay 覆蓋層 -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-purple-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <h2 class="text-4xl sm:text-5xl font-black text-pink-500 mb-2 drop-shadow-md">GAME OVER</h2>
                <p class="text-purple-200 text-sm mb-4">撞到障礙物囉！再試一次吧！</p>
                
                <div class="bg-purple-900/60 p-4 rounded-xl border border-pink-500/30 mb-6 w-64">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="text-purple-300">最終得分：</span>
                        <span id="finalScore" class="text-yellow-300 font-bold">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-purple-300">最高紀錄：</span>
                        <span id="finalBest" class="text-pink-300 font-bold">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="kuromi-btn px-8 py-3 text-white text-lg font-black tracking-wider rounded-full">
                    再玩一次 RESTART
                </button>
            </div>
        </div>

        <!-- 手機/觸控裝置 控制按鈕列 -->
        <div class="w-full flex justify-between gap-4 mt-4 sm:hidden">
            <button id="mobileDuckBtn" class="kuromi-btn flex-1 py-3 text-white text-base font-bold rounded-xl active:scale-95">
                蹲下 🠗
            </button>
            <button id="mobileJumpBtn" class="kuromi-btn flex-1 py-3 text-white text-base font-bold rounded-xl active:scale-95">
                跳躍 🠕
            </button>
        </div>

        <!-- 遊戲操作說明與頁腳資訊 -->
        <footer class="mt-4 text-center text-xs text-purple-300/80 flex items-center justify-center space-x-4">
            <span>鍵盤操作：[Space/↑] 跳躍 | [↓] 蹲下</span>
            <span>•</span>
            <span>Kuromi Fan Game</span>
        </footer>
    </main>

    <!-- JavaScript 遊戲邏輯與繪圖程式碼 -->
    <script>
        // ==========================================
        // 1. 初始化與變數定義 (Initialization & Variables)
        // ==========================================
        // DOM 元素參考
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreText = document.getElementById('scoreText');
        const heartsText = document.getElementById('heartsText');
        const highScoreText = document.getElementById('highScoreText');
        
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScore = document.getElementById('finalScore');
        const finalBest = document.getElementById('finalBest');

        const mobileJumpBtn = document.getElementById('mobileJumpBtn');
        const mobileDuckBtn = document.getElementById('mobileDuckBtn');

        // 遊戲畫布維度與物理參數
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 400;
        const GROUND_Y = 320; // 地面高度 (Y 軸)

        // 設定 Canvas 解析度
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // 遊戲狀態與數據變數
        let isGameRunning = false;
        let score = 0;
        let heartsCount = 0;
        let highScore = localStorage.getItem('kuromi_high_score') || 0;
        highScoreText.innerText = highScore;

        let frameCount = 0;
        const baseSpeed = 5;
        let gameSpeed = baseSpeed;
        const speedIncrement = 0.001;

        // ==========================================
        // 2. 玩家角色 (Player Object - 完全還原官方向量庫洛米 Kuromi)
        // ==========================================
        const player = {
            x: 80,
            y: GROUND_Y - 70,
            width: 60,
            height: 70,
            normalHeight: 70,
            duckHeight: 42,
            velocityY: 0,
            gravity: 0.6,
            jumpPower: -12.5,
            isJumping: false,
            isDucking: false,
            rotation: 0,
            runFrame: 0,       // 跑酷腳步與體態動畫計數
            blinkTimer: 0,     // 眨眼時間計數器
            isBlinking: false, // 當前是否處於眨眼狀態

            // 更新玩家位置與狀態動畫
            update() {
                // 跑步與擺動計數
                this.runFrame += gameSpeed * 0.15;

                // 眨眼邏輯
                this.blinkTimer++;
                if (this.blinkTimer > 180) {
                    this.isBlinking = true;
                    if (this.blinkTimer > 192) {
                        this.isBlinking = false;
                        this.blinkTimer = Math.floor(Math.random() * 50);
                    }
                }

                // 蹲下動作處理
                if (this.isDucking && !this.isJumping) {
                    this.height = this.duckHeight;
                } else {
                    this.height = this.normalHeight;
                }

                // 套用重力
                this.velocityY += this.gravity;
                this.y += this.velocityY;

                // 地面碰撞檢測
                if (this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.velocityY = 0;
                    this.isJumping = false;
                }

                // 跳躍姿態旋轉
                if (this.isJumping) {
                    this.rotation = -0.12;
                } else {
                    this.rotation = 0;
                }
            },

            // 執行跳躍
            jump() {
                if (!this.isJumping) {
                    this.velocityY = this.jumpPower;
                    this.isJumping = true;
                }
            },

            // 完全還原官方向量庫洛米繪製系統 (Official Kuromi Canvas Renderer)
            draw() {
                ctx.save();
                // 轉換畫布座標原點至庫洛米中心
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.rotation);

                // 蹲下時變形壓扁動畫
                if (this.isDucking && !this.isJumping) {
                    ctx.scale(1.15, 0.65);
                }

                const px = -this.width / 2;
                const py = -this.height / 2;

                const darkFill = '#2c2c2c';  // 庫洛米黑色頭巾與領圈
                const strokeColor = '#1a1a1a'; // 官方黑框粗線條

                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // ------------------------------------------
                // 1. 黑色小惡魔箭頭尾巴 (Devil Arrow Tail)
                // ------------------------------------------
                const tailWiggle = Math.sin(this.runFrame * 0.8) * 5;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(px + 18, py + 52);
                ctx.quadraticCurveTo(px - 4, py + 48 + tailWiggle, px - 12, py + 56 + tailWiggle);
                ctx.stroke();

                // 尾巴末端黑色箭頭 (Spade Arrow Tip)
                ctx.fillStyle = darkFill;
                ctx.beginPath();
                const tx = px - 12;
                const ty = py + 56 + tailWiggle;
                ctx.moveTo(tx, ty - 6);
                ctx.lineTo(tx - 12, ty);
                ctx.lineTo(tx, ty + 6);
                ctx.lineTo(tx - 4, ty);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // ------------------------------------------
                // 2. 純白小巧身體與手腳 (White Legs, Body & Hands)
                // ------------------------------------------
                const legOffset = Math.sin(this.runFrame) * 6;

                // 腳腳 (純白圓潤小腿)
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.2;

                // 左腳
                ctx.beginPath();
                ctx.arc(px + 22 - (this.isJumping ? 0 : legOffset), py + 64, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 右腳
                ctx.beginPath();
                ctx.arc(px + 38 + (this.isJumping ? 0 : legOffset), py + 64, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 純白身體
                ctx.beginPath();
                ctx.roundRect(px + 18, py + 42, 24, 22, [10, 10, 8, 8]);
                ctx.fill();
                ctx.stroke();

                // 純白小手手 (兩側小巧凸起)
                ctx.beginPath();
                ctx.arc(px + 15, py + 50, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(px + 45, py + 50, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // ------------------------------------------
                // 3. 黑色幾何小丑領圈 (Jester Collar with Pink Balls)
                // ------------------------------------------
                ctx.fillStyle = darkFill;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                // 五個向外延伸的幾何尖角
                ctx.moveTo(px + 14, py + 43);
                ctx.lineTo(px + 6, py + 52);  // 角 1
                ctx.lineTo(px + 20, py + 47);
                ctx.lineTo(px + 22, py + 56); // 角 2
                ctx.lineTo(px + 30, py + 48);
                ctx.lineTo(px + 38, py + 56); // 角 3
                ctx.lineTo(px + 40, py + 47);
                ctx.lineTo(px + 54, py + 52); // 角 4
                ctx.lineTo(px + 46, py + 43);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 領圈點點末端粉紅小球
                ctx.fillStyle = '#ff77bc';
                const collarBalls = [
                    { x: px + 6, y: py + 52 },
                    { x: px + 22, y: py + 56 },
                    { x: px + 38, y: py + 56 },
                    { x: px + 54, y: py + 52 }
                ];
                collarBalls.forEach(ball => {
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });

                // ------------------------------------------
                // 4. 黑色頭巾主體與高聳惡魔角 (Black Hood & Devil Horn Ears)
                // ------------------------------------------
                ctx.fillStyle = darkFill;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.5;

                // 左高聳幾何耳形角
                ctx.beginPath();
                ctx.moveTo(px + 18, py + 20);
                ctx.lineTo(px - 8, py - 14); // 尖角頂點
                ctx.lineTo(px + 24, py + 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 左耳朵灰圓球
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(px - 8, py - 14, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 右高聳幾何耳形角
                ctx.fillStyle = darkFill;
                ctx.beginPath();
                ctx.moveTo(px + 42, py + 20);
                ctx.lineTo(px + 68, py - 14); // 尖角頂點
                ctx.lineTo(px + 36, py + 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 右耳朵灰圓球
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(px + 68, py - 14, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 黑色正圓頭巾主體
                ctx.fillStyle = darkFill;
                ctx.beginPath();
                ctx.arc(px + 30, py + 25, 23, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // ------------------------------------------
                // 5. 圓潤白臉與雙弧波浪邊界 (White Face with Double-Arc Wave)
                // ------------------------------------------
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                // 頂部兩側波浪彎向中間交會，下方橢圓包覆
                ctx.moveTo(px + 30, py + 21); // 中間交點 (V 點)
                ctx.bezierCurveTo(px + 24, py + 14, px + 12, py + 16, px + 12, py + 27); // 左波浪
                ctx.bezierCurveTo(px + 10, py + 38, px + 20, py + 44, px + 30, py + 44); // 左下顎
                ctx.bezierCurveTo(px + 40, py + 44, px + 50, py + 38, px + 48, py + 27); // 右下顎
                ctx.bezierCurveTo(px + 48, py + 16, px + 36, py + 14, px + 30, py + 21); // 右波浪
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // ------------------------------------------
                // 6. 額頭經典粉紅骷髏圖騰 (Forehead Pink Skull Emblem)
                // ------------------------------------------
                ctx.fillStyle = '#ff77bc';
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1.5;
                // 骷髏頭本體
                ctx.beginPath();
                ctx.arc(px + 30, py + 11, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 骷髏眼睛 (黑色圓點)
                ctx.fillStyle = strokeColor;
                ctx.beginPath();
                ctx.arc(px + 27.5, py + 11, 1.3, 0, Math.PI * 2);
                ctx.arc(px + 32.5, py + 11, 1.3, 0, Math.PI * 2);
                ctx.fill();

                // 骷髏 3 條牙齒線條
                ctx.beginPath();
                ctx.moveTo(px + 28, py + 16); ctx.lineTo(px + 28, py + 18.5);
                ctx.moveTo(px + 30, py + 16); ctx.lineTo(px + 30, py + 18.5);
                ctx.moveTo(px + 32, py + 16); ctx.lineTo(px + 32, py + 18.5);
                ctx.stroke();

                // ------------------------------------------
                // 7. 五官 (長橢圓上揚大眼、斜睫毛、粉紅圓鼻、俏皮波浪嘴)
                // ------------------------------------------
                if (this.isBlinking) {
                    // 眨眼
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(px + 21, py + 29, 3.5, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.arc(px + 39, py + 29, 3.5, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();
                } else {
                    // 黑色長橢圓斜眼
                    ctx.fillStyle = strokeColor;

                    // 左眼 (向外傾斜)
                    ctx.save();
                    ctx.translate(px + 21, py + 29);
                    ctx.rotate(-0.15);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 3.2, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // 右眼 (向外傾斜)
                    ctx.save();
                    ctx.translate(px + 39, py + 29);
                    ctx.rotate(0.15);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 3.2, 5.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // 眼睛上方向外斜上揚的睫毛 (2 根)
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    // 左睫毛
                    ctx.moveTo(px + 17, py + 24); ctx.lineTo(px + 14, py + 21);
                    ctx.moveTo(px + 19, py + 23); ctx.lineTo(px + 16, py + 19.5);
                    // 右睫毛
                    ctx.moveTo(px + 43, py + 24); ctx.lineTo(px + 46, py + 21);
                    ctx.moveTo(px + 41, py + 23); ctx.lineTo(px + 44, py + 19.5);
                    ctx.stroke();
                }

                // 粉紅色橢圓小鼻子
                ctx.fillStyle = '#ff77bc';
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(px + 30, py + 32.5, 2.2, 1.6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 俏皮波浪微笑嘴巴
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(px + 26, py + 36);
                ctx.quadraticCurveTo(px + 30, py + 39, px + 34, py + 36);
                ctx.stroke();

                ctx.restore();
            }
        };

        // ==========================================
        // 3. 障礙物與收集品陣列與類別 (Obstacles & Collectibles)
        // ==========================================
        let obstacles = [];
        let collectibles = [];

        // 障礙物類別
        class Obstacle {
            constructor() {
                this.x = GAME_WIDTH + 50;
                // 隨機障礙物類型: 1: 黑色甜甜圈, 2: 可愛骷髏頭 (低), 3: 高空蝙蝠障礙 (需蹲下)
                this.type = Math.floor(Math.random() * 3) + 1;
                
                if (this.type === 1) { // 黑色甜甜圈
                    this.width = 40;
                    this.height = 40;
                    this.y = GROUND_Y - this.height;
                } else if (this.type === 2) { // 骷髏障礙柱
                    this.width = 35;
                    this.height = 55;
                    this.y = GROUND_Y - this.height;
                } else { // 飄浮高空蝙蝠障礙（強制玩家蹲下）
                    this.width = 45;
                    this.height = 35;
                    this.y = GROUND_Y - 75; // 高度在空中
                }
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                ctx.save();
                if (this.type === 1) {
                    // --- 繪製 黑色/紫色甜甜圈 ---
                    ctx.fillStyle = '#2a113b';
                    ctx.beginPath();
                    ctx.arc(this.x + 20, this.y + 20, 20, 0, Math.PI * 2);
                    ctx.fill();
                    // 粉色糖霜淋醬
                    ctx.fillStyle = '#ff77bc';
                    ctx.beginPath();
                    ctx.arc(this.x + 20, this.y + 18, 16, 0, Math.PI, true);
                    ctx.fill();
                    // 中間洞口
                    ctx.fillStyle = '#1e102d';
                    ctx.beginPath();
                    ctx.arc(this.x + 20, this.y + 20, 7, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 2) {
                    // --- 繪製 可愛骷髏障礙柱 ---
                    ctx.fillStyle = '#4a255b';
                    ctx.fillRect(this.x + 10, this.y + 20, 15, 35);

                    // 上方骷髏頭
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(this.x + 17.5, this.y + 15, 17.5, 0, Math.PI * 2);
                    ctx.fill();

                    // 骷髏黑眼圈
                    ctx.fillStyle = '#1e102d';
                    ctx.beginPath();
                    ctx.arc(this.x + 11, this.y + 13, 4, 0, Math.PI * 2);
                    ctx.arc(this.x + 24, this.y + 13, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // 鼻洞
                    ctx.beginPath();
                    ctx.arc(this.x + 17.5, this.y + 19, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // --- 繪製 高空小惡魔蝙蝠 ---
                    ctx.fillStyle = '#7928a1';
                    // 翅膀
                    ctx.beginPath();
                    ctx.ellipse(this.x + 10, this.y + 15, 15, 8, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(this.x + 35, this.y + 15, 15, 8, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 身體
                    ctx.fillStyle = '#ff77bc';
                    ctx.beginPath();
                    ctx.arc(this.x + 22.5, this.y + 17, 12, 0, Math.PI * 2);
                    ctx.fill();
                    // 惡魔眼
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + 17, this.y + 14, 3, 3);
                    ctx.fillRect(this.x + 25, this.y + 14, 3, 3);
                }
                ctx.restore();
            }
        }

        // 收集品類別 (愛心與金幣)
        class Collectible {
            constructor() {
                this.x = GAME_WIDTH + 50;
                // 隨機高度
                this.y = GROUND_Y - (Math.random() > 0.5 ? 40 : 90);
                this.width = 25;
                this.height = 25;
                this.type = Math.random() > 0.3 ? 'heart' : 'coin'; // 70% 愛心, 30% 金幣
                this.collected = false;
                this.bounceOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= gameSpeed;
                // 輕微上下浮動動畫
                this.bounceOffset += 0.08;
            }

            draw() {
                if (this.collected) return;
                ctx.save();
                const floatY = this.y + Math.sin(this.bounceOffset) * 4;

                if (this.type === 'heart') {
                    // --- 繪製 粉紅心形 ---
                    ctx.fillStyle = '#ff77bc';
                    ctx.beginPath();
                    const topCurveHeight = this.height * 0.3;
                    ctx.moveTo(this.x + this.width / 2, floatY + topCurveHeight);
                    // 左半邊心形
                    ctx.bezierCurveTo(
                        this.x + this.width / 2, floatY,
                        this.x, floatY,
                        this.x, floatY + topCurveHeight
                    );
                    ctx.bezierCurveTo(
                        this.x, floatY + (this.height + topCurveHeight) / 2,
                        this.x + this.width / 2, floatY + this.height,
                        this.x + this.width / 2, floatY + this.height
                    );
                    // 右半邊心形
                    ctx.bezierCurveTo(
                        this.x + this.width / 2, floatY + this.height,
                        this.x + this.width, floatY + (this.height + topCurveHeight) / 2,
                        this.x + this.width, floatY + topCurveHeight
                    );
                    ctx.bezierCurveTo(
                        this.x + this.width, floatY,
                        this.x + this.width / 2, floatY,
                        this.x + this.width / 2, floatY + topCurveHeight
                    );
                    ctx.fill();
                } else {
                    // --- 繪製 金色骷髏硬幣 ---
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(this.x + 12.5, floatY + 12.5, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffa500';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 硬幣上的小粉紅點點
                    ctx.fillStyle = '#ff77bc';
                    ctx.beginPath();
                    ctx.arc(this.x + 12.5, floatY + 12.5, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // ==========================================
        // 4. 動態背景繪製 (Background Elements)
        // ==========================================
        
        // 背景微粒與星芒
        const stars = Array.from({ length: 40 }, () => ({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * (GAME_HEIGHT - 80),
            size: Math.random() * 2 + 1,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.01
        }));

        // 繪製夜空與星芒動畫
        function drawBackground() {
            // 背景紫色漸層
            const bgGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            bgGradient.addColorStop(0, '#130924');
            bgGradient.addColorStop(0.7, '#2a113b');
            bgGradient.addColorStop(1, '#4a195c');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 閃爍星星
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.globalAlpha = Math.abs(star.alpha);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 繪製遠景紫色城堡剪影
            ctx.fillStyle = '#210c30';
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(0, GROUND_Y - 50);
            ctx.lineTo(40, GROUND_Y - 90);
            ctx.lineTo(80, GROUND_Y - 50);
            ctx.lineTo(150, GROUND_Y - 70);
            ctx.lineTo(220, GROUND_Y - 40);
            ctx.lineTo(300, GROUND_Y - 110);
            ctx.lineTo(380, GROUND_Y - 50);
            ctx.lineTo(500, GROUND_Y - 80);
            ctx.lineTo(600, GROUND_Y - 45);
            ctx.lineTo(720, GROUND_Y - 100);
            ctx.lineTo(GAME_WIDTH, GROUND_Y - 40);
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.fill();

            // 繪製可愛卡通地面 (暗紫底 + 粉紅頂邊層)
            ctx.fillStyle = '#1c0a26';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

            // 地面草地/跑道亮線
            ctx.fillStyle = '#ff77bc';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 6);

            // 繪製滾動中的地面圖案條紋
            ctx.strokeStyle = 'rgba(255, 119, 188, 0.2)';
            ctx.lineWidth = 4;
            const stripeOffset = (frameCount * gameSpeed) % 40;
            for (let x = -stripeOffset; x < GAME_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y + 6);
                ctx.lineTo(x - 20, GAME_HEIGHT);
                ctx.stroke();
            }
        }

        // ==========================================
        // 5. 碰撞檢測與遊戲邏輯 (Collisions & Game Loop)
        // ==========================================

        // AABB 矩形碰撞檢測演算法
        function checkCollision(rect1, rect2) {
            // 為讓玩家體驗更容錯，將碰撞邊框稍微縮減 (Padding)
            const padding = 8;
            return (
                rect1.x + padding < rect2.x + rect2.width &&
                rect1.x + rect1.width - padding > rect2.x &&
                rect1.y + padding < rect2.y + rect2.height &&
                rect1.y + rect1.height - padding > rect2.y
            );
        }

        // 產出障礙物與收集品
        function spawnEntities() {
            // 每隔一定幀數生成障礙物
            if (frameCount % Math.max(80, Math.floor(140 - gameSpeed * 5)) === 0) {
                if (Math.random() > 0.2) {
                    obstacles.push(new Obstacle());
                }
            }

            // 產出愛心或硬幣
            if (frameCount % 110 === 0) {
                collectibles.push(new Collectible());
            }
        }

        // 遊戲結束處理
        function triggerGameOver() {
            isGameRunning = false;
            
            // 更新最高紀錄
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('kuromi_high_score', highScore);
                highScoreText.innerText = highScore;
            }

            // 顯示 GameOver Overlay
            finalScore.innerText = Math.floor(score);
            finalBest.innerText = highScore;
            gameOverOverlay.classList.remove('hidden');
        }

        // 重置遊戲數據
        function resetGame() {
            score = 0;
            heartsCount = 0;
            gameSpeed = baseSpeed;
            frameCount = 0;
            obstacles = [];
            collectibles = [];
            player.y = GROUND_Y - player.height;
            player.velocityY = 0;
            player.isJumping = false;
            player.isDucking = false;

            scoreText.innerText = '0';
            heartsText.innerText = '0';
            gameOverOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden');

            isGameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        // 遊戲主要迴圈 (Main Game Loop)
        function gameLoop() {
            if (!isGameRunning) return;

            frameCount++;
            gameSpeed += speedIncrement; // 隨時間逐漸加快速度

            // 1. 清空與繪製背景
            drawBackground();

            // 2. 更新與繪製玩家
            player.update();
            player.draw();

            // 3. 生成新物件
            spawnEntities();

            // 4. 更新與繪製障礙物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                // 檢測是否與玩家碰撞
                if (checkCollision(player, obs)) {
                    triggerGameOver();
                    return;
                }

                // 移除移出畫面的障礙物
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 5. 更新與繪製收集品
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                item.update();
                item.draw();

                // 檢測玩家收集
                if (!item.collected && checkCollision(player, item)) {
                    item.collected = true;
                    if (item.type === 'heart') {
                        heartsCount += 1;
                        score += 50; // 愛心額外加 50 分
                        heartsText.innerText = heartsCount;
                    } else {
                        score += 100; // 金幣額外加 100 分
                    }
                    collectibles.splice(i, 1);
                } else if (item.x + item.width < 0) {
                    collectibles.splice(i, 1);
                }
            }

            // 6. 遞增分數並更新 UI
            score += 0.15;
            scoreText.innerText = Math.floor(score);

            // 繼續下一幀
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 6. 事件監聽與控制器 (Controls & Handlers)
        // ==========================================

        // 鍵盤按下事件
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (isGameRunning) {
                    player.jump();
                } else if (!startOverlay.classList.contains('hidden')) {
                    resetGame();
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (isGameRunning) {
                    player.isDucking = true;
                }
            }
        });

        // 鍵盤放開事件
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                player.isDucking = false;
            }
        });

        // 按鈕點擊事件
        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        // 手機/觸控裝置 控制支援
        mobileJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGameRunning) player.jump();
        });
        mobileDuckBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGameRunning) player.isDucking = true;
        });
        mobileDuckBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            player.isDucking = false;
        });

        // 滑鼠/畫布點擊支援跳躍
        canvas.addEventListener('mousedown', () => {
            if (isGameRunning) player.jump();
        });

        // 初始繪製背景靜態畫面
        drawBackground();
    </script>
</body>
</html>
